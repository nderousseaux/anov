introTitle: Notre Histoire
introText1: >-
  Une passion transmise de génération en génération, un engagement envers
  l'excellence, et une vision unique de la gastronomie moderne.
introText2: >-
  Depuis 2018, l'anøv incarne l'art de recevoir à la française, où chaque détail
  compte et où chaque instant devient un souvenir inoubliable.
chefName: Chef Antoine Dubois
chefText1: >-
  Formé dans les plus grandes maisons étoilées de France, Antoine a parcouru le
  monde pour découvrir de nouvelles saveurs et techniques.
chefText2: >-
  Son retour à Paris marque le début d'une aventure unique : créer un lieu où
  tradition et innovation se rencontrent, où le respect des produits s'allie à
  une créativité sans limite.
visionTitle: Une Vision, Une Passion
visionText1: >-
  En 2018, l'anøv ouvre ses portes dans le cœur historique de Paris. L'idée ?
  Créer un sanctuaire gastronomique où chaque détail compte, où chaque plat est
  une célébration des produits d'exception.
visionText2: >-
  Notre philosophie repose sur trois piliers : le respect du produit, la
  créativité sans compromis, et une expérience client irréprochable.
visionText3: >-
  Ces valeurs guident chaque décision, de la sélection des ingrédients au
  service en salle. Elles sont au cœur de notre identité et font de chaque repas
  un moment d'exception.
productsTitle: L'Excellence des Produits
productsText1: >-
  Chaque matin, nous parcourons les meilleurs marchés pour sélectionner les
  produits les plus frais et savoureux.
productsText2: >-
  Des légumes bio de nos maraîchers partenaires aux poissons de ligne de
  Bretagne, chaque ingrédient est choisi avec le plus grand soin. Nous
  privilégions les circuits courts et les producteurs locaux qui partagent notre
  passion pour l'excellence.
teamTitle: Une Équipe d'Exception
teamText1: >-
  Derrière l'anøv, une équipe de passionnés travaille en parfaite harmonie. Du
  chef de cuisine au maître d'hôtel, chacun apporte son expertise et son
  dévouement pour créer une expérience unique.
teamText2: >-
  Notre brigade compte 15 personnes en cuisine et 8 en salle, tous sélectionnés
  pour leur talent et leur attachement aux valeurs de la maison. L'esprit
  d'équipe et la rigueur sont nos moteurs quotidiens.
teamText3: >-
  Nous formons également de jeunes talents, transmettant notre savoir-faire et
  notre passion pour perpétuer l'excellence de la gastronomie française.
wineTitle: Une Cave d'Exception
wineText1: >-
  Notre sommelier, Pierre Lefèvre, a constitué une cave de plus de 800
  références. Des grands crus classés aux pépites de vignerons indépendants,
  chaque bouteille a été sélectionnée pour sublimer notre cuisine.
wineText2: >-
  L'accord mets et vins est pour nous un art à part entière. Pierre travaille en
  étroite collaboration avec Antoine pour créer des harmonies parfaites,
  révélant le meilleur de chaque plat et de chaque vin.
wineText3: >-
  Notre cave climatisée abrite des trésors de toutes les régions viticoles
  françaises, mais aussi des découvertes venues d'ailleurs, d'Italie au Nouveau
  Monde.
gestureTitle: La Maîtrise du Geste
gestureText: >-
  La technique au service de l'émotion, la précision au service de la
  créativité. Chaque plat est le fruit d'un savoir-faire méticuleux et d'une
  passion sans faille.
engagementTitle: Notre Engagement
engagementText1: >-
  Chaque jour, nous nous efforçons de créer des moments d'exception, de
  surprendre et d'émouvoir nos convives.
engagementText2: >-
  Notre ambition n'est pas seulement de nourrir, mais de créer des souvenirs, de
  raconter des histoires à travers nos assiettes, et de perpétuer l'excellence
  de la gastronomie française pour les générations futures.
