description_fr: >-
  Située au cœur de la Franche-Comté, notre cuisine puise son inspiration dans
  les richesses du terroir local et des régions voisines.
description_en: >-
  Located in the heart of Franche-Comté, our cuisine draws its inspiration from
  the riches of the local terroir and neighboring regions.
description_de: >-
  Im Herzen der Franche-Comté gelegen, schöpft unsere Küche ihre Inspiration
  aus den Reichtümern des lokalen Terroirs und der Nachbarregionen.
subtitle_fr: >-
  De la Suisse à la Bourgogne, en passant par le Jura, nous sélectionnons les
  meilleurs produits pour vous offrir une expérience gastronomique unique.
subtitle_en: >-
  From Switzerland to Burgundy, via the Jura, we select the finest products to
  offer you a unique gastronomic experience.
subtitle_de: >-
  Von der Schweiz über Burgund bis zum Jura wählen wir die besten Produkte
  aus, um Ihnen ein einzigartiges gastronomisches Erlebnis zu bieten.
