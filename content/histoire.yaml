introTitle_fr: Notre Histoire
introTitle_en: Our Story
introTitle_de: Unsere Geschichte
introText1_fr: >-
  Une passion transmise de génération en génération, un engagement envers
  l'excellence, et une vision unique de la gastronomie moderne.
introText1_en: >-
  A passion passed down through the generations, a commitment to excellence,
  and a unique vision of modern gastronomy.
introText1_de: >-
  Eine Leidenschaft, die von Generation zu Generation weitergegeben wird,
  ein Engagement für Exzellenz und eine einzigartige Vision der modernen Gastronomie.
introText2_fr: >-
  Depuis 2018, l'anøv incarne l'art de recevoir à la française, où chaque
  détail compte et où chaque instant devient un souvenir inoubliable.
introText2_en: >-
  Since 2018, l'anøv has embodied the French art of hospitality, where every
  detail matters and every moment becomes an unforgettable memory.
introText2_de: >-
  Seit 2018 verkörpert l'anøv die französische Gastkunst, wo jedes Detail
  zählt und jeder Augenblick zu einer unvergesslichen Erinnerung wird.
chefName: Chef Antoine Dubois
chefText1_fr: >-
  Formé dans les plus grandes maisons étoilées de France, Antoine a parcouru
  le monde pour découvrir de nouvelles saveurs et techniques.
chefText1_en: >-
  Trained in France's finest Michelin-starred establishments, Antoine travelled
  the world to discover new flavours and techniques.
chefText1_de: >-
  In Frankreichs renommiertesten Sternehäusern ausgebildet, bereiste Antoine
  die Welt, um neue Aromen und Techniken zu entdecken.
chefText2_fr: >-
  Son retour à Paris marque le début d'une aventure unique : créer un lieu où
  tradition et innovation se rencontrent, où le respect des produits s'allie à
  une créativité sans limite.
chefText2_en: >-
  His return to Paris marks the beginning of a unique adventure: creating a
  place where tradition and innovation meet, where respect for ingredients
  combines with boundless creativity.
chefText2_de: >-
  Seine Rückkehr nach Paris markiert den Beginn eines einzigartigen Abenteuers:
  einen Ort zu schaffen, wo Tradition und Innovation sich begegnen.
visionTitle_fr: Une Vision, Une Passion
visionTitle_en: One Vision, One Passion
visionTitle_de: Eine Vision, Eine Leidenschaft
visionText1_fr: >-
  En 2018, l'anøv ouvre ses portes dans le cœur historique de Paris. L'idée ?
  Créer un sanctuaire gastronomique où chaque détail compte, où chaque plat est
  une célébration des produits d'exception.
visionText1_en: >-
  In 2018, l'anøv opened its doors in the historic heart of Paris. The idea?
  To create a gastronomic sanctuary where every detail counts and every dish
  is a celebration of exceptional ingredients.
visionText1_de: >-
  Im Jahr 2018 öffnete l'anøv seine Türen im historischen Herzen von Paris.
  Ein gastronomisches Heiligtum, wo jedes Detail zählt.
visionText2_fr: >-
  Notre philosophie repose sur trois piliers : le respect du produit, la
  créativité sans compromis, et une expérience client irréprochable.
visionText2_en: >-
  Our philosophy rests on three pillars: respect for the ingredient,
  uncompromising creativity, and an impeccable guest experience.
visionText2_de: >-
  Unsere Philosophie basiert auf drei Säulen: Respekt vor dem Produkt,
  kompromisslose Kreativität und ein makelloses Gästeerlebnis.
visionText3_fr: >-
  Ces valeurs guident chaque décision, de la sélection des ingrédients au
  service en salle. Elles font de chaque repas un moment d'exception.
visionText3_en: >-
  These values guide every decision, from ingredient selection to dining room
  service. They make every meal an exceptional moment.
visionText3_de: >-
  Diese Werte leiten jede Entscheidung und machen jede Mahlzeit zu einem
  außergewöhnlichen Moment.
productsTitle_fr: L'Excellence des Produits
productsTitle_en: The Excellence of Produce
productsTitle_de: Die Exzellenz der Produkte
productsText1_fr: >-
  Chaque matin, nous parcourons les meilleurs marchés pour sélectionner les
  produits les plus frais et savoureux.
productsText1_en: >-
  Every morning, we visit the finest markets to select the freshest and most
  flavourful ingredients.
productsText1_de: >-
  Jeden Morgen besuchen wir die besten Märkte, um die frischesten und
  geschmackvollsten Zutaten auszuwählen.
productsText2_fr: >-
  Des légumes bio de nos maraîchers partenaires aux poissons de ligne de
  Bretagne, chaque ingrédient est choisi avec le plus grand soin.
productsText2_en: >-
  From organic vegetables to line-caught fish from Brittany, every ingredient
  is selected with the greatest care.
productsText2_de: >-
  Von Bio-Gemüse bis hin zu handgeangeltem Fisch aus der Bretagne wird jede
  Zutat mit größter Sorgfalt ausgewählt.
teamTitle_fr: Une Équipe d'Exception
teamTitle_en: An Exceptional Team
teamTitle_de: Ein außergewöhnliches Team
teamText1_fr: >-
  Derrière l'anøv, une équipe de passionnés travaille en parfaite harmonie. Du
  chef de cuisine au maître d'hôtel, chacun apporte son expertise et son
  dévouement pour créer une expérience unique.
teamText1_en: >-
  Behind l'anøv, a team of passionate individuals works in perfect harmony.
  From head chef to maître d'hôtel, each member brings their expertise and
  dedication to create a unique experience.
teamText1_de: >-
  Hinter l'anøv arbeitet ein Team von Leidenschaftlichen in perfekter Harmonie,
  um ein einzigartiges Erlebnis zu schaffen.
teamText2_fr: >-
  Notre brigade compte 15 personnes en cuisine et 8 en salle, tous sélectionnés
  pour leur talent et leur attachement aux valeurs de la maison.
teamText2_en: >-
  Our brigade numbers 15 in the kitchen and 8 in the dining room, all selected
  for their talent and commitment to the house values.
teamText2_de: >-
  Unsere Brigade umfasst 15 Personen in der Küche und 8 im Saal, alle für ihr
  Talent und ihr Engagement ausgewählt.
teamText3_fr: >-
  Nous formons également de jeunes talents, transmettant notre savoir-faire et
  notre passion pour perpétuer l'excellence de la gastronomie française.
teamText3_en: >-
  We also train young talents, passing on our expertise and passion to perpetuate
  the excellence of French gastronomy.
teamText3_de: >-
  Wir bilden auch junge Talente aus und geben unser Know-how und unsere
  Leidenschaft weiter.
wineTitle_fr: Une Cave d'Exception
wineTitle_en: An Exceptional Wine Cellar
wineTitle_de: Ein außergewöhnlicher Weinkeller
wineText1_fr: >-
  Notre sommelier, Pierre Lefèvre, a constitué une cave de plus de 800
  références, des grands crus classés aux pépites de vignerons indépendants.
wineText1_en: >-
  Our sommelier Pierre Lefèvre has assembled a cellar of over 800 references,
  from grand crus classés to gems from independent winemakers.
wineText1_de: >-
  Unser Sommelier Pierre Lefèvre hat einen Weinkeller mit über 800 Referenzen
  zusammengestellt, von Grands Crus bis hin zu Perlen unabhängiger Winzer.
wineText2_fr: >-
  L'accord mets et vins est pour nous un art à part entière. Pierre travaille
  en étroite collaboration avec Antoine pour créer des harmonies parfaites.
wineText2_en: >-
  Food and wine pairing is for us a complete art form. Pierre works closely
  with Antoine to create perfect harmonies.
wineText2_de: >-
  Die Speis-Wein-Kombination ist für uns eine eigenständige Kunstform.
  Pierre arbeitet eng mit Antoine zusammen.
wineText3_fr: >-
  Notre cave climatisée abrite des trésors de toutes les régions viticoles
  françaises, mais aussi des découvertes venues d'ailleurs, d'Italie au Nouveau Monde.
wineText3_en: >-
  Our climate-controlled cellar houses treasures from all French wine regions,
  as well as discoveries from Italy to the New World.
wineText3_de: >-
  Unser klimatisierter Weinkeller beherbergt Schätze aus allen französischen
  Weinregionen sowie Entdeckungen aus aller Welt.
gestureTitle_fr: La Maîtrise du Geste
gestureTitle_en: The Mastery of Craft
gestureTitle_de: Die Meisterschaft der Handwerkskunst
gestureText_fr: >-
  La technique au service de l'émotion, la précision au service de la créativité.
  Chaque plat est le fruit d'un savoir-faire méticuleux et d'une passion sans faille.
gestureText_en: >-
  Technique in service of emotion, precision in service of creativity. Every dish
  is the fruit of meticulous craftsmanship and unwavering passion.
gestureText_de: >-
  Technik im Dienst der Emotion, Präzision im Dienst der Kreativität. Jedes
  Gericht ist das Ergebnis meisterlichen Handwerks und unerschütterlicher Leidenschaft.
engagementTitle_fr: Notre Engagement
engagementTitle_en: Our Commitment
engagementTitle_de: Unser Engagement
engagementText1_fr: >-
  Chaque jour, nous nous efforçons de créer des moments d'exception, de
  surprendre et d'émouvoir nos convives.
engagementText1_en: >-
  Every day, we strive to create exceptional moments, to surprise and move our guests.
engagementText1_de: >-
  Jeden Tag bemühen wir uns, außergewöhnliche Momente zu schaffen und unsere
  Gäste zu überraschen und zu bewegen.
engagementText2_fr: >-
  Notre ambition n'est pas seulement de nourrir, mais de créer des souvenirs, de
  raconter des histoires à travers nos assiettes, et de perpétuer l'excellence
  de la gastronomie française pour les générations futures.
engagementText2_en: >-
  Our ambition is not merely to feed, but to create memories, to tell stories
  through our dishes, and to perpetuate the excellence of French gastronomy
  for future generations.
engagementText2_de: >-
  Unser Ehrgeiz ist es nicht nur zu ernähren, sondern Erinnerungen zu schaffen
  und die Exzellenz der französischen Gastronomie für zukünftige Generationen
  zu perpetuieren.
